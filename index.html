<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            color: white;
            padding: 20px;
            position: relative;
        }

        .fondo-pintura {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            transition: opacity 3s ease-in-out;
            opacity: 0;
        }

        .fondo-pintura.activa {
            opacity: 1;
        }

        .capa-lectura {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.40);
            z-index: 1;
        }

        .app {
            position: relative;
            z-index: 2;
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2rem;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            background: rgba(255,255,255,0.9);
            color: #222;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #1e90ff;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #0073e6;
        }

        ul {
            list-style: none;
        }

        li {
            background: rgba(255,255,255,0.9);
            color: #222;
            margin-bottom: 12px;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: aparecer 0.4s ease;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .borrar {
            background: #ff4d4d;
            padding: 8px 12px;
            font-size: 0.9rem;
        }

        .borrar:hover {
            background: #cc0000;
        }

        .estado {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        footer {
            position: relative;
            z-index: 2;
            text-align: center;
            margin-top: 30px;
            font-size: 0.85rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="fondo-pintura activa" id="pintura1" style="background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg/1280px-Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg');"></div>
    <div class="fondo-pintura" id="pintura2" style="background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/9/9d/Vincent_van_Gogh_-_De_sterrennacht_boven_de_rhone_-_Google_Art_Project.jpg/1280px-Vincent_van_Gogh_-_De_sterrennacht_boven_de_rhone_-_Google_Art_Project.jpg');"></div>
    <div class="fondo-pintura" id="pintura3" style="background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/0/06/Vincent_van_Gogh_-_Starry_Night_Over_the_Rhone.jpg/1280px-Vincent_van_Gogh_-_Starry_Night_Over_the_Rhone.jpg');"></div>

    <div class="capa-lectura"></div>

    <div class="app">
        <h1>Mis Tareas</h1>

        <div class="input-group">
            <input type="text" id="tareaInput" placeholder="Escribe una tarea...">
            <button id="agregarBtn">Agregar</button>
        </div>

        <ul id="listaTareas"></ul>

        <p class="estado" id="estadoSincro">🔄 Sincronizando...</p>
    </div>

    <footer>
        Van Gogh · La Noche Estrellada
    </footer>

    <script>
        // 👇 PON TUS DATOS DE FIREBASE AQUÍ CUANDO LOS TENGAS
        const firebaseConfig = {
            apiKey: "PON_TU_API_KEY_AQUI",
            authDomain: "PON_TU_AUTH_DOMAIN_AQUI",
            projectId: "PON_TU_PROJECT_ID_AQUI",
            storageBucket: "PON_TU_STORAGE_BUCKET_AQUI",
            messagingSenderId: "PON_TU_MESSAGING_SENDER_ID_AQUI",
            appId: "PON_TU_APP_ID_AQUI"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const userId = localStorage.getItem('kev_user_id') || generarUserId();
        localStorage.setItem('kev_user_id', userId);

        const tareaInput = document.getElementById('tareaInput');
        const agregarBtn = document.getElementById('agregarBtn');
        const listaTareas = document.getElementById('listaTareas');
        const estadoSincro = document.getElementById('estadoSincro');

        let indice = 0;
        const pinturas = ['pintura1', 'pintura2', 'pintura3'];

        function cambiarFondo() {
            document.getElementById(pinturas[indice]).classList.remove('activa');
            indice = (indice + 1) % pinturas.length;
            document.getElementById(pinturas[indice]).classList.add('activa');
            
            // La Noche Estrellada dura 14 segundos, las demás 10 segundos
            const tiempo = indice === 0 ? 14000 : 10000;
            setTimeout(cambiarFondo, tiempo);
        }
        setTimeout(cambiarFondo, 14000);

        function generarUserId() {
            return 'usuario-kev-' + Math.random().toString(36).substring(2, 10);
        }

        function agregarTarea() {
            const texto = tareaInput.value.trim();
            if (!texto) { alert('Escribe una tarea primero'); return; }

            db.collection('tareas').add({
                texto: texto,
                userId: userId,
                fecha: new Date()
            });

            tareaInput.value = '';
            estadoSincro.textContent = '✅ Guardado y sincronizado';
            setTimeout(() => { estadoSincro.textContent = '🔄 Sincronizando...'; }, 2000);
        }

        function eliminarTarea(id) {
            db.collection('tareas').doc(id).delete();
            estadoSincro.textContent = '🗑️ Eliminado y sincronizado';
            setTimeout(() => { estadoSincro.textContent = '🔄 Sincronizando...'; }, 2000);
        }

        function mostrarTarea(doc) {
            const tarea = doc.data();
            const li = document.createElement('li');
            li.innerHTML = `
                <span>${tarea.texto}</span>
                <button class="borrar">Eliminar</button>
            `;
            li.querySelector('.borrar').addEventListener('click', () => eliminarTarea(doc.id));
            listaTareas.appendChild(li);
        }

        db.collection('tareas')
            .where('userId', '==', userId)
            .orderBy('fecha')
            .onSnapshot(snapshot => {
                listaTareas.innerHTML = '';
                snapshot.forEach(doc => mostrarTarea(doc));
                estadoSincro.textContent = '✅ Actualizado';
                setTimeout(() => { estadoSincro.textContent = '🔄 Sincronizando...'; }, 3000);
            });

        agregarBtn.addEventListener('click', agregarTarea);
        tareaInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') agregarTarea();
        });
    </script>

</body>
</html>
