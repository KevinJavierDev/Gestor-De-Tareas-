<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Tareas</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            color: white;
            padding: 20px;
            position: relative;
        }

        .fondo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 3s ease-in-out;
        }

        .fondo.activa {
            opacity: 1;
        }

        .capa-oscura {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }

        .app {
            position: relative;
            z-index: 2;
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.2rem;
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .frase {
            text-align: center;
            margin-bottom: 25px;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1rem;
            opacity: 0.85;
            line-height: 1.6;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }

        .fila {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 14px 18px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-family: 'Quicksand', sans-serif;
            background: rgba(255,255,255,0.9);
            color: #222;
            outline: none;
            transition: transform 0.2s ease;
        }

        input:focus {
            transform: scale(1.02);
        }

        button {
            padding: 14px 22px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #1e90ff, #4169e1);
            color: white;
            font-size: 1rem;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 15px rgba(30, 144, 255, 0.4);
        }

        ul {
            list-style: none;
        }

        li {
            background: rgba(255,255,255,0.92);
            color: #222;
            margin-bottom: 14px;
            padding: 18px;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: aparecer 0.4s ease;
        }

        li.aviso-dia {
            box-shadow: 0 0 15px 2px #9b59b6;
            border: 2px solid #9b59b6;
        }

        li.aviso-hora {
            box-shadow: 0 0 15px 2px #f39c12;
            border: 2px solid #f39c12;
        }

        li.aviso-entrega {
            box-shadow: 0 0 20px 4px #e74c3c;
            border: 3px solid #e74c3c;
            animation: pulsar 1s infinite;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulsar {
            0% { box-shadow: 0 0 20px 4px #e74c3c; }
            50% { box-shadow: 0 0 30px 8px #e74c3c; }
            100% { box-shadow: 0 0 20px 4px #e74c3c; }
        }

        .tarea-texto {
            font-family: 'Quicksand', sans-serif;
            font-weight: 500;
            font-size: 1.05rem;
        }

        .tarea-fecha {
            font-family: 'Playfair Display', serif;
            font-size: 0.9rem;
            color: #555;
            font-style: italic;
        }

        .mensaje-alerta {
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 0.9rem;
        }

        .borrar {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            padding: 10px 16px;
            font-size: 0.9rem;
            align-self: flex-start;
        }

        .borrar:hover {
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.35);
        }

        footer {
            position: relative;
            z-index: 2;
            text-align: center;
            margin-top: 35px;
            font-size: 0.9rem;
            font-family: 'Playfair Display', serif;
            opacity: 0.7;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="fondo activa" id="fondo1" style="background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg/1280px-Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg');"></div>
    <div class="fondo" id="fondo2" style="background-image: url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');"></div>
    <div class="fondo" id="fondo3" style="background-image: url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');"></div>
    <div class="fondo" id="fondo4" style="background-image: url('https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');"></div>

    <div class="capa-oscura"></div>

    <div class="app">
        <h1>Mis Tareas 🔔</h1>
        
        <p class="frase">La grandeza no surge de la suerte, sino de la constancia de tu esfuerzo.</p>

        <div class="input-group">
            <input type="text" id="tareaInput" placeholder="Escribe una tarea...">
            <div class="fila">
                <input type="date" id="fechaInput">
                <input type="time" id="horaInput">
            </div>
            <button id="agregarBtn">Agregar Tarea</button>
        </div>

        <ul id="listaTareas"></ul>
    </div>

    <footer>
        Van Gogh · Universo · Estrellas
    </footer>

    <script>
        const tareaInput = document.getElementById('tareaInput');
        const fechaInput = document.getElementById('fechaInput');
        const horaInput = document.getElementById('horaInput');
        const agregarBtn = document.getElementById('agregarBtn');
        const listaTareas = document.getElementById('listaTareas');

        // Fondo cambiante
        const fondos = ['fondo1', 'fondo2', 'fondo3', 'fondo4'];
        const tiempos = [14000, 10000, 10000, 10000];
        let indice = 0;

        function cambiarFondo() {
            fondos.forEach(id => document.getElementById(id).classList.remove('activa'));
            document.getElementById(fondos[indice]).classList.add('activa');
            indice = (indice + 1) % fondos.length;
            setTimeout(cambiarFondo, tiempos[indice]);
        }
        setTimeout(cambiarFondo, 14000);

        // Sonido de alarma
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        function hacerSonarAlarma(tipo) {
            const patrones = {
                dia: [392, 494, 587, 392, 494, 587],
                hora: [523, 659, 523, 659, 523, 659],
                entrega: [659, 784, 659, 784, 880, 784, 659, 784]
            };
            const notas = patrones[tipo] || patrones.entrega;
            let tiempo = audioContext.currentTime;
            
            notas.forEach(frec => {
                const osc = audioContext.createOscillator();
                const gan = audioContext.createGain();
                osc.connect(gan);
                gan.connect(audioContext.destination);
                osc.frequency.value = frec;
                osc.type = 'sine';
                gan.gain.setValueAtTime(0.3, tiempo);
                gan.gain.exponentialRampToValueAtTime(0.01, tiempo + 0.35);
                osc.start(tiempo);
                osc.stop(tiempo + 0.35);
                tiempo += 0.4;
            });
        }

        function formatearFecha(fecha, hora) {
            if (!fecha && !hora) return 'Sin fecha y hora';
            let texto = '';
            if (fecha) {
                const f = new Date(fecha + 'T00:00:00');
                texto += f.toLocaleDateString('es-ES', {day:'numeric', month:'long', year:'numeric'});
            }
            if (hora) texto += (fecha ? ' · ' : '') + hora;
            return texto;
        }

        function cargarTareas() {
            const guardadas = JSON.parse(localStorage.getItem('mis_tareas') || '[]');
            listaTareas.innerHTML = '';
            guardadas.forEach(t => mostrarTarea(t));
        }

        function mostrarTarea(tarea) {
            if (!tarea.fecha || !tarea.hora) {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span class="tarea-texto">${tarea.texto}</span>
                    <span class="tarea-fecha">📅 Sin fecha de entrega</span>
                    <button class="borrar">Eliminar</button>
                `;
                li.querySelector('.borrar').addEventListener('click', () => eliminarTarea(tarea.id));
                listaTareas.appendChild(li);
                return;
            }

            const ahora = new Date();
            const entrega = new Date(`${tarea.fecha}T${tarea.hora}`);
            const unDiaAntes = new Date(entrega.getTime() - 24 * 60 * 60 * 1000);
            const unaHoraAntes = new Date(entrega.getTime() - 60 * 60 * 1000);
            const unMinutoAntes = new Date(entrega.getTime() - 60 * 1000);

            let claseExtra = '';
            let mensajeExtra = '';

            if (ahora >= unMinutoAntes && !tarea.avisoEntrega) {
                claseExtra = 'aviso-entrega';
                mensajeExtra = `<span class="mensaje-alerta" style="background:#e74c3c; color:white;">⏰ ¡Es hora de entregar tu tarea!</span>`;
            } else if (ahora >= unaHoraAntes && !tarea.avisoHora) {
                claseExtra = 'aviso-hora';
                mensajeExtra = `<span class="mensaje-alerta" style="background:#f39c12; color:black;">🕐 Falta 1 hora para la entrega</span>`;
            } else if (ahora >= unDiaAntes && !tarea.avisoDia) {
                claseExtra = 'aviso-dia';
                mensajeExtra = `<span class="mensaje-alerta" style="background:#9b59b6; color:white;">📅 Falta 1 día para la entrega</span>`;
            }

            const li = document.createElement('li');
            if (claseExtra) li.classList.add(claseExtra);
            li.innerHTML = `
                <span class="tarea-texto">${tarea.texto}</span>
                <span class="tarea-fecha">📅 Entrega: ${formatearFecha(tarea.fecha, tarea.hora)}</span>
                ${mensajeExtra}
                <button class="borrar">Eliminar</button>
            `;
            li.querySelector('.borrar').addEventListener('click', () => eliminarTarea(tarea.id));
            listaTareas.appendChild(li);
        }

        function agregarTarea() {
            const texto = tareaInput.value.trim();
            const fecha = fechaInput.value;
            const hora = horaInput.value;

            if (!texto) { alert('Escribe una tarea primero'); return; }

            const tarea = {
                id: Date.now(),
                texto: texto,
                fecha: fecha,
                hora: hora,
                avisoDia: false,
                avisoHora: false,
                avisoEntrega: false
            };

            const tareas = JSON.parse(localStorage.getItem('mis_tareas') || '[]');
            tareas.push(tarea);
            localStorage.setItem('mis_tareas', JSON.stringify(tareas));

            tareaInput.value = '';
            fechaInput.value = '';
            horaInput.value = '';

            cargarTareas();
        }

        function eliminarTarea(id) {
            let tareas = JSON.parse(localStorage.getItem('mis_tareas') || '[]');
            tareas = tareas.filter(t => t.id !== id);
            localStorage.setItem('mis_tareas', JSON.stringify(tareas));
            cargarTareas();
        }

        function revisarAlarmas() {
            const tareas = JSON.parse(localStorage.getItem('mis_tareas') || '[]');
            const ahora = new Date();
            let huboCambio = false;

            const tareasActualizadas = tareas.map(t => {
                if (!t.fecha || !t.hora) return t;

                const entrega = new Date(`${t.fecha}T${t.hora}`);
                const unDiaAntes = new Date(entrega.getTime() - 24 * 60 * 60 * 1000);
                const unaHoraAntes = new Date(entrega.getTime() - 60 * 60 * 1000);
                const unMinutoAntes = new Date(entrega.getTime() - 60 * 1000);

                if (ahora >= unDiaAntes && !t.avisoDia) {
                    hacerSonarAlarma('dia');
                    huboCambio = true;
                    return {...t, avisoDia: true};
                }
                if (ahora >= unaHoraAntes && !t.avisoHora) {
                    hacerSonarAlarma('hora');
                    huboCambio = true;
                    return {...t, avisoHora: true};
                }
                if (ahora >= unMinutoAntes && !t.avisoEntrega) {
                    hacerSonarAlarma('entrega');
                    huboCambio = true;
                    return {...t, avisoEntrega: true};
                }
                return t;
            });

            if (huboCambio) {
                localStorage.setItem('mis_tareas', JSON.stringify(tareasActualizadas));
                cargarTareas();
            }
        }

        agregarBtn.addEventListener('click', agregarTarea);
        tareaInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') agregarTarea();
        });

        cargarTareas();
        setInterval(revisarAlarmas, 1000);
    </script>

</body>
</html>
