<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- Fuentes elegantes cargadas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            color: white;
            padding: 20px;
            position: relative;
        }

        .fondo-pintura {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            transition: opacity 3s ease-in-out;
            opacity: 0;
        }

        .fondo-pintura.activa {
            opacity: 1;
        }

        .capa-lectura {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.42);
            z-index: 1;
        }

        .app {
            position: relative;
            z-index: 2;
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 2.2rem;
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }

        .fila {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 14px 18px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-family: 'Quicksand', sans-serif;
            background: rgba(255,255,255,0.9);
            color: #222;
            outline: none;
            transition: transform 0.2s ease;
        }

        input:focus {
            transform: scale(1.02);
        }

        button {
            padding: 14px 22px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #1e90ff, #4169e1);
            color: white;
            font-size: 1rem;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        button:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 15px rgba(30, 144, 255, 0.4);
        }

        ul {
            list-style: none;
        }

        li {
            background: rgba(255,255,255,0.92);
            color: #222;
            margin-bottom: 14px;
            padding: 18px;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: aparecer 0.4s ease;
        }

        .tarea-texto {
            font-family: 'Quicksand', sans-serif;
            font-weight: 500;
            font-size: 1.05rem;
            line-height: 1.5;
        }

        .tarea-fecha {
            font-family: 'Playfair Display', serif;
            font-size: 0.9rem;
            color: #555;
            font-style: italic;
        }

        .tarea-botones {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .borrar {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            padding: 10px 16px;
            font-size: 0.9rem;
        }

        .borrar:hover {
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.35);
        }

        .estado {
            text-align: center;
            margin-top: 18px;
            font-size: 0.9rem;
            font-family: 'Quicksand', sans-serif;
            opacity: 0.85;
        }

        footer {
            position: relative;
            z-index: 2;
            text-align: center;
            margin-top: 35px;
            font-size: 0.9rem;
            font-family: 'Playfair Display', serif;
            opacity: 0.7;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="fondo-pintura activa" id="pintura1" style="background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg/1280px-Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg');"></div>
    <div class="fondo-pintura" id="pintura2" style="background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/9/9d/Vincent_van_Gogh_-_De_sterrennacht_boven_de_rhone_-_Google_Art_Project.jpg/1280px-Vincent_van_Gogh_-_De_sterrennacht_boven_de_rhone_-_Google_Art_Project.jpg');"></div>
    <div class="fondo-pintura" id="pintura3" style="background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/0/06/Vincent_van_Gogh_-_Starry_Night_Over_the_Rhone.jpg/1280px-Vincent_van_Gogh_-_Starry_Night_Over_the_Rhone.jpg');"></div>

    <div class="capa-lectura"></div>

    <div class="app">
        <h1>Mis Tareas</h1>

        <div class="input-group">
            <input type="text" id="tareaInput" placeholder="Escribe una tarea...">
            <div class="fila">
                <input type="date" id="fechaInput">
                <input type="time" id="horaInput">
            </div>
            <button id="agregarBtn">Agregar Tarea</button>
        </div>

        <ul id="listaTareas"></ul>

        <p class="estado" id="estadoSincro">⚠️ Configurando...</p>
    </div>

    <footer>
        Van Gogh · La Noche Estrellada
    </footer>

    <script>
        // 👇 PON TUS DATOS DE FIREBASE AQUÍ CUANDO LOS TENGAS
        const firebaseConfig = {
            apiKey: "PON_TU_API_KEY_AQUI",
            authDomain: "PON_TU_AUTH_DOMAIN_AQUI",
            projectId: "PON_TU_PROJECT_ID_AQUI",
            storageBucket: "PON_TU_STORAGE_BUCKET_AQUI",
            messagingSenderId: "PON_TU_MESSAGING_SENDER_ID_AQUI",
            appId: "PON_TU_APP_ID_AQUI"
        };

        let db = null;
        let userId = null;

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            userId = localStorage.getItem('kev_user_id') || generarUserId();
            localStorage.setItem('kev_user_id', userId);
            document.getElementById('estadoSincro').textContent = '✅ Conectado';
        } catch (error) {
            document.getElementById('estadoSincro').textContent = '💾 Guardando localmente';
        }

        const tareaInput = document.getElementById('tareaInput');
        const fechaInput = document.getElementById('fechaInput');
        const horaInput = document.getElementById('horaInput');
        const agregarBtn = document.getElementById('agregarBtn');
        const listaTareas = document.getElementById('listaTareas');
        const estadoSincro = document.getElementById('estadoSincro');

        let indice = 0;
        const pinturas = ['pintura1', 'pintura2', 'pintura3'];
        const tiempos = [14000, 10000, 10000];

        function cambiarFondo() {
            pinturas.forEach(id => document.getElementById(id).classList.remove('activa'));
            document.getElementById(pinturas[indice]).classList.add('activa');
            indice = (indice + 1) % pinturas.length;
            setTimeout(cambiarFondo, tiempos[indice]);
        }
        setTimeout(cambiarFondo, 14000);

        function generarUserId() {
            return 'usuario-kev-' + Math.random().toString(36).substring(2, 10);
        }

        function formatearFecha(fecha, hora) {
            if (!fecha && !hora) return 'Sin fecha y hora';
            let texto = '';
            if (fecha) {
                const f = new Date(fecha + 'T00:00:00');
                texto += f.toLocaleDateString('es-ES', {day:'numeric', month:'long', year:'numeric'});
            }
            if (hora) texto += (fecha ? ' · ' : '') + hora;
            return texto;
        }

        async function agregarTarea() {
            const texto = tareaInput.value.trim();
            const fecha = fechaInput.value;
            const hora = horaInput.value;

            if (!texto) { alert('Escribe una tarea primero'); return; }

            const datos = {
                texto: texto,
                fechaLimite: fecha || null,
                horaLimite: hora || null,
                userId: userId,
                fecha: new Date()
            };

            if (db) {
                await db.collection('tareas').add(datos);
                estadoSincro.textContent = '✅ Guardado y sincronizado';
                setTimeout(() => { estadoSincro.textContent = '🔄 Sincronizando...'; }, 2000);
            } else {
                const locales = JSON.parse(localStorage.getItem('tareas_temp') || '[]');
                locales.push({...datos, id: Date.now()});
                localStorage.setItem('tareas_temp', JSON.stringify(locales));
                cargarTareasLocales();
                estadoSincro.textContent = '💾 Guardado localmente';
            }

            tareaInput.value = '';
            fechaInput.value = '';
            horaInput.value = '';
        }

        async function eliminarTarea(id, esLocal) {
            if (!esLocal && db) {
                await db.collection('tareas').doc(id).delete();
                estadoSincro.textContent = '🗑️ Eliminado';
                setTimeout(() => { estadoSincro.textContent = '✅ Actualizado'; }, 2000);
            } else if (esLocal) {
                let locales = JSON.parse(localStorage.getItem('tareas_temp') || '[]');
                locales = locales.filter(t => t.id !== parseInt(id));
                localStorage.setItem('tareas_temp', JSON.stringify(locales));
                cargarTareasLocales();
            }
        }

        function mostrarTarea(tarea, id, esLocal=false) {
            const li = document.createElement('li');
            li.innerHTML = `
                <span class="tarea-texto">${tarea.texto}</span>
                <span class="tarea-fecha">📅 ${formatearFecha(tarea.fechaLimite, tarea.horaLimite)}</span>
                <div class="tarea-botones">
                    <button class="borrar">Eliminar</button>
                </div>
            `;
            li.querySelector('.borrar').addEventListener('click', () => eliminarTarea(id, esLocal));
            listaTareas.appendChild(li);
        }

        function cargarTareasLocales() {
            listaTareas.innerHTML = '';
            const locales = JSON.parse(localStorage.getItem('tareas_temp') || '[]');
            locales.forEach(t => mostrarTarea(t, t.id, true));
        }

        if (db) {
            db.collection('tareas')
                .where('userId', '==', userId)
                .orderBy('fecha')
                .onSnapshot(snapshot => {
                    listaTareas.innerHTML = '';
                    snapshot.forEach(doc => mostrarTarea(doc.data(), doc.id));
                    estadoSincro.textContent = '✅ Actualizado';
                    setTimeout(() => { estadoSincro.textContent = '🔄 Sincronizando...'; }, 3000);
                });
        } else {
            cargarTareasLocales();
        }

        agregarBtn.addEventListener('click', agregarTarea);
        tareaInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') agregarTarea();
        });
    </script>

</body>
</html>
